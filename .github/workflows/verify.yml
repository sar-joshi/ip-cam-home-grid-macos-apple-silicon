name: Verify HomeGrid
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install media dependencies
        run: |
          if [ ! -d /Applications/VLC.app ]; then brew install --cask vlc; fi
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
      - name: Build and verify signature
        run: |
          ./build.sh
          codesign --verify --strict HomeGrid.app
      - name: Generate synthetic camera fixture
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=15 \
            -t 120 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p \
            -g 15 -an -y "$RUNNER_TEMP/test-camera.mp4"
      - name: Model, authentication, session and RTSP tests
        run: HOMEGRID_TEST_FIXTURE="$RUNNER_TEMP/test-camera.mp4" ./test.sh --reconnect
      - name: Package Apple Silicon app
        run: ditto -c -k --keepParent HomeGrid.app HomeGrid-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HomeGrid-macOS-AppleSilicon
          path: HomeGrid-macOS-AppleSilicon.zip
          retention-days: 14
